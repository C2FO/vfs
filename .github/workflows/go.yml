name: Go

on:
  pull_request:
    branches:
      - main
      - v6

# Concurrency Setting
concurrency:
  # Cancel any previous runs of this workflow as long as its not main
  # to free up runners
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  get_modules:
    name: Get Modules
    runs-on: ubuntu-latest
    outputs:
      modules: ${{ steps.modules.outputs.modules }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Find all modules
        id: modules
        run: |
          modules=$(find . -name go.mod -exec dirname {} \; | jq --raw-input --slurp --compact-output 'split("\n")[:-1]')
          echo "Modules found:"
          echo $modules | jq -r ".[]"
          echo "modules=$modules" >> $GITHUB_OUTPUT

  test:
    needs: get_modules
    strategy:
      fail-fast: false
      matrix:
        go-version: [ 1.26, 1.27 ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        module: ${{ fromJson(needs.get_modules.outputs.modules) }}
    runs-on: ${{ matrix.os }}
    name: Test ${{ matrix.module }} (Go ${{ matrix.go-version }}, ${{ matrix.os }})
    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
          check-latest: true
          cache: false
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set TMPDIR for Windows
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path C:\Temp | Out-Null
          "TEMP=C:\Temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "TMP=C:\Temp" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Run Tests
        working-directory: ${{ matrix.module }}
        run: |
          echo "Testing module: ${{ matrix.module }}"
          echo "Temporary directory: $TMPDIR"
          go test -race ./...

  # Single required-status-check gate for the whole test matrix. The matrix above
  # fans out into a dynamic, ever-changing set of per-module/version/OS checks that
  # can't reasonably be enumerated in branch protection, so branch protection/rulesets
  # should require only this job instead of every generated "Test ..." check.
  test-required:
    name: Test (required)
    needs: test
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Verify test matrix succeeded
        run: |
          result="${{ needs.test.result }}"
          echo "Test matrix result: $result"
          if [ "$result" != "success" ]; then
            echo "One or more jobs in the test matrix did not succeed."
            exit 1
          fi
