name: Integration (testcontainers)

# Runs the testcontainers module, which stands up real backend servers as
# disposable Docker containers and runs the shared conformance + IO suites
# against them. This requires a Docker daemon, so it lives in its own Linux-only
# workflow rather than the generic multi-OS test matrix.

on:
  pull_request:
    branches:
      - main
  schedule:
    # Nightly run to catch upstream image/backend drift even without a PR.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  testcontainers:
    name: testcontainers conformance
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
    steps:
      - name: Install Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26'
          check-latest: true
          cache: false

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Authenticating lifts the anonymous Docker Hub pull rate limit that shared
      # runners frequently hit. Optional: skipped automatically on forks and
      # whenever the DOCKERHUB_* secrets are not configured.
      - name: Log in to Docker Hub
        if: ${{ env.DOCKERHUB_USERNAME != '' && env.DOCKERHUB_TOKEN != '' }}
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ env.DOCKERHUB_TOKEN }}

      - name: Run integration tests
        working-directory: testcontainers
        run: go test -tags=vfsintegration -race -timeout 30m ./...
